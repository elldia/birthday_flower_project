<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="탄생화, 탄생꽃, 생일꽃">
    <meta name="description" content="내가 태어난 날의 탄생화는 무엇일까 알아봅시다.">
    <title>나의 탄생화는 무엇일까?</title>
    <link rel="shortcut icon" href="https://cdn-icons-png.flaticon.com/128/1497/1497177.png" type="image/x-icon">
    <link rel="stylesheet" href="./styles/reset.css">
    <link rel="stylesheet" href="./styles/index.css">
    <script src="./scripts/index.js" defer></script>
</head>
<body>
    <main>
        <div class="title">
            <p>The Flower of My Birth Day</p>
            <h1>나의 탄생화 찾기</h1>
        </div>
        <div class="contents">
            <input type="number" maxlength="2" required name="user_birthday" id="user_birthday" placeholder="태어난 달을 숫자로 입력해주세요">
            <button type="button" id="birthday_result_btn">나의 꽃과 꽃말 만나기</button>
        </div>
        <!-- (위) 버튼 클릭 시 실행 결과 팝업창 -->
        <section class="popup_wrap">
            <p class="sub_title">birthday Month <span class="month">12</span>월</p>
            <p class="flower">꽃말 : <em class="msg">자기애, 자존심, 외로움</em></p>
            <p class="result">
                당신의 탄생화는<br>
                '<em class="flower_type">수선화</em>'입니다.
            </p>
        </section>
        <div class="popup_bg"></div>
    </main>
</body>
</html>
